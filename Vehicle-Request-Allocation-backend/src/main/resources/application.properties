spring.application.name=Vehicle-Request-Allocation-backend
spring.datasource.name=QuickRide

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/QuickRide
spring.datasource.username=root
spring.datasource.password=1808
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#Radis Setup
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Respository Disable
spring.data.redis.repositories.enabled=false

#Enable Radis as a cache Service
spring.cache.type=redis

#CleanUp Logic Of Redis
spring.profiles.active=dev

#(time-to-live) for cache entries
spring.cache.redis.time-to-live=60000

